<section class="password" aria-labelledby="password-title">
  <h2 id="password-title">{{ 'password.title' | translate }}</h2>
  <p class="muted">{{ 'password.text' | translate }}</p>

  @if (error(); as message) {
    <p class="error-banner" role="alert">{{ message | message }}</p>
  }
  @if (changed()) {
    <p class="notice password__done" role="status">{{ 'password.changed' | translate }}</p>
  }

  <section class="panel">
    <form class="fields" (submit)="$event.preventDefault(); change()">
      <!-- Lets password managers know which login the new password belongs to. -->
      <input type="text" name="username" autocomplete="username" [value]="name()" hidden readonly />
      <label class="field">
        <span class="field__label">{{ 'password.current' | translate }}</span>
        <input
          class="text-input password__current"
          type="password"
          name="current-password"
          autocomplete="current-password"
          [attr.maxlength]="passwordLimit()?.max ?? null"
          [value]="currentPassword()"
          (input)="currentPassword.set(value($event))"
          [disabled]="busy()"
        />
      </label>
      <label class="field">
        <span class="field__label">{{ 'password.new' | translate }}</span>
        <input
          class="text-input password__new"
          type="password"
          name="new-password"
          autocomplete="new-password"
          [attr.maxlength]="passwordLimit()?.max ?? null"
          [value]="newPassword()"
          (input)="newPassword.set(value($event))"
          [disabled]="busy()"
        />
        @if (passwordLimit(); as limit) {
          <span class="field__help muted">{{ 'signIn.create.passwordHelp' | translate: limit }}</span>
        }
      </label>
      <label class="field">
        <span class="field__label">{{ 'password.repeat' | translate }}</span>
        <input
          class="text-input password__repeat"
          type="password"
          name="repeat-password"
          autocomplete="new-password"
          [attr.maxlength]="passwordLimit()?.max ?? null"
          [value]="repeatPassword()"
          (input)="repeatPassword.set(value($event))"
          [disabled]="busy()"
        />
      </label>
      <button type="submit" class="btn btn--primary password__submit" [disabled]="!canSubmit()">
        {{ (busy() ? 'password.saving' : 'password.submit') | translate }}
      </button>
    </form>
  </section>
</section>
