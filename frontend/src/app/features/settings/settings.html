<section class="page settings">
  <header class="settings__head">
    <h1>{{ 'settings.title' | translate }}</h1>
    @if (auth.account(); as account) {
      <p class="muted">
        {{ 'settings.signedInAs' | translate: { name: account.name } }}
        @if (account.isAdmin) {
          <span class="badge">{{ 'settings.admin' | translate }}</span>
        }
      </p>
    }
  </header>

  @if (tabs().length > 1) {
    <nav class="tabs" [attr.aria-label]="'settings.tabs.label' | translate">
      @for (tab of tabs(); track tab.path) {
        <a
          class="tab"
          [routerLink]="tab.path"
          routerLinkActive="tab--on"
          ariaCurrentWhenActive="page"
          >{{ tab.label | translate }}</a
        >
      }
    </nav>
  }

  <router-outlet />
</section>
