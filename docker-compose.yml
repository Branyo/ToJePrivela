# Runs the game: "docker compose up -d --build". Settings and secrets come from .env (copy .env.example).

services:
  api:
    build: .
    restart: unless-stopped
    environment:
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Authentication__Admins__0__Name: ${ADMIN_NAME:?Set ADMIN_NAME in .env}
      Authentication__Admins__0__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      OpenAi__ApiKey: ${OPENAI_API_KEY:-}
      ForwardedHeaders__KnownProxies__0: 172.30.0.10
    volumes:
      - data:/data
    networks:
      app:

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      app:
        # Fixed, so the API can trust the client address this proxy forwards.
        ipv4_address: 172.30.0.10

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  data:
  caddy_data:
  caddy_config:
